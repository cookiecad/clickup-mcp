name: Synthetic credential masking tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  masking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test with the production Python version
        run: |
          docker run --rm -v "$PWD:/source" -w /source python:3.12-slim sh -c 'pip install ".[test]" && pytest -q'
      - name: Build the server image
        run: docker build -t clickup-mcp:ci .
