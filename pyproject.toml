[project]
name = "clickup-mcp"
version = "0.1.0"
description = "MCP server for ClickUp REST API (tasks, search, activity, generic endpoint)"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
clickup-mcp = "clickup_mcp.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

